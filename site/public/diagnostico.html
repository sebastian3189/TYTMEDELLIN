<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Diagnóstico de movimiento</title>
<!-- TEMPORAL (2026-10-23): diagnóstico de por qué la mano del inicio y las paradas se ven fijas en el navegador del usuario. Borrar tras usarlo. -->
<style>
  :root { --ok: #1b7f3b; --mal: #c0392b; --tinta: #3C3F3B; --fondo: #F4F4F4; }
  body { margin: 0; padding: 24px 16px; background: var(--fondo); color: var(--tinta); font: 18px/1.5 Inter, Arial, sans-serif; }
  h1 { font: 700 26px/1.2 Montserrat, Arial, sans-serif; margin: 0 0 16px; }
  table { border-collapse: collapse; width: 100%; max-width: 760px; background: #fff; }
  td { padding: 10px 12px; border-bottom: 1px solid #ddd; vertical-align: top; }
  td:first-child { font-weight: 600; width: 46%; }
  .ok { color: var(--ok); font-weight: 700; } .mal { color: var(--mal); font-weight: 700; }
  button { margin-top: 20px; padding: 12px 20px; font: 600 16px Inter, Arial, sans-serif; border: 0; border-radius: 999px; background: #FF7F09; color: #fff; cursor: pointer; }
  #veredicto { margin: 18px 0; padding: 14px 16px; max-width: 736px; background: #fff; border-left: 6px solid #FF7F09; }
</style>
</head>
<body>
<h1>Diagnóstico de movimiento · T&amp;T</h1>
<table id="t"></table>
<div id="veredicto"></div>
<button id="borrar" type="button">Borrar «Reducir movimiento» guardado y volver al inicio</button>
<script>
  const c = navigator.connection || {};
  const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let flag = null; try { flag = localStorage.getItem('tyt-reducir-movimiento'); } catch (e) { flag = 'sin acceso'; }
  const filas = [
    ['Dirección', location.origin, true],
    ['Ancho × alto de la ventana', innerWidth + ' × ' + innerHeight + ' px', innerWidth >= 1000 && innerHeight >= 620],
    ['Zoom / densidad', Math.round(devicePixelRatio * 100) + ' %', true],
    ['Windows: animaciones apagadas', reduce ? 'SÍ (apaga la mano y las paradas)' : 'no', !reduce],
    ['Botón «Reducir movimiento» guardado', flag === '1' ? 'SÍ (apaga la mano)' : 'no', flag !== '1'],
    ['Ahorro de datos', String(!!c.saveData), true],
    ['Red estimada', c.effectiveType || 'desconocida', true],
    ['Navegador', navigator.userAgent.match(/Edg\/[\d.]+|Chrome\/[\d.]+|Firefox\/[\d.]+/)?.[0] || navigator.userAgent, true],
  ];
  document.getElementById('t').innerHTML = filas.map(([k, v, ok]) => `<tr><td>${k}</td><td class="${ok ? 'ok' : 'mal'}">${v}</td></tr>`).join('');
  const motivos = [];
  if (reduce) motivos.push('Windows tiene las animaciones apagadas: Configuración → Accesibilidad → Efectos visuales → activa «Efectos de animación» y recarga.');
  if (flag === '1') motivos.push('Está guardado «Reducir movimiento»: pulsa el botón naranja de abajo.');
  if (innerWidth < 1000 || innerHeight < 620) motivos.push('La ventana es pequeña: las paradas se muestran en lista como en el celular. Maximiza el navegador o baja el zoom (Ctrl + 0).');
  document.getElementById('veredicto').textContent = motivos.length ? motivos.join(' ') : 'Todo en orden: la mano y las paradas deberían verse animadas.';
  document.getElementById('borrar').onclick = () => { try { localStorage.removeItem('tyt-reducir-movimiento'); } catch (e) {} location.href = '/'; };
</script>
</body>
</html>
