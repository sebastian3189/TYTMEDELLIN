              - heading "Recuerdos para llevar contigo" [level=3] [ref=e358]
              - paragraph [ref=e359]: Consulta las fotografías y los videos incluidos en tu recorrido. La propuesta detalla estos servicios para que sepas qué esperar antes de salir.
