              - heading "Monitoreamos tu vuelo" [level=3] [ref=e303]
              - paragraph [ref=e304]: Seguimos el estado de tu vuelo hasta su aterrizaje en Medellín para coordinar tu recogida y estar preparados ante posibles cambios de horario.
            - listitem [ref=e305]:
              - generic [aria-hidden] [ref=e311]: "02"
              - heading "Vehículos para tu recorrido" [level=3] [ref=e312]
              - paragraph [ref=e313]: Revisamos contigo la categoría, la capacidad y el equipaje para proponer el vehículo de tu servicio. La unidad y su disponibilidad se confirman al cotizar.
            - listitem [ref=e314]:
              - generic [aria-hidden] [ref=e322]: "03"
              - heading "Un equipo que responde por ti" [level=3] [ref=e323]
              - paragraph [ref=e324]: Coordinamos el transporte, las paradas y el acompañamiento de tu recorrido. Antes de contratar, revisamos contigo los servicios incluidos en la propuesta.
            - listitem [ref=e325]:
              - generic [aria-hidden] [ref=e330]: "04"
              - heading "Los detalles también cuentan" [level=3] [ref=e331]
              - paragraph [ref=e332]: Consulta la hidratación incluida en tu experiencia. Antes de salir, revisa con el equipo qué llevar según el recorrido y las necesidades de tu grupo.
            - listitem [ref=e333]:
              - generic [aria-hidden] [ref=e339]: "05"
              - heading "Experiencias 100% privadas" [level=3] [ref=e340]
              - paragraph [ref=e341]: Nuestra propuesta son tours privados para ti y tus acompañantes. Confirmamos el vehículo, el acompañamiento y las condiciones de cada recorrido al cotizar.
            - listitem [ref=e342]:
              - generic [aria-hidden] [ref=e348]: "06"
              - heading "Flexibilidad en tus horarios" [level=3] [ref=e349]
              - paragraph [ref=e350]: Cuéntanos tus intereses y el tiempo que tienes. Acordamos los horarios según el recorrido, las condiciones operativas y lo que necesitas.
